<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/schoolbridge-app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Select the role-aware manifest before the browser evaluates PWA installability.
      (() => {
        const params = new URLSearchParams(window.location.search)
        const school = params.get('school')
        const audience = params.get('audience')
        if (!school || !['parent', 'teacher', 'staff'].includes(audience)) return
        const manifest = {
          id: school && ['parent', 'teacher', 'staff'].includes(audience)
            ? '/?school=' + encodeURIComponent(school) + '&audience=' + audience
            : '/',
          name: 'SchoolBridge',
          short_name: 'SchoolBridge',
          start_url: school && ['parent', 'teacher', 'staff'].includes(audience)
            ? '/?school=' + encodeURIComponent(school) + '&audience=' + audience
            : '/',
          scope: '/',
          display: 'standalone',
          orientation: 'any',
          background_color: '#f5f7fb',
          theme_color: '#173b63',
          icons: [
            { src: '/icons/schoolbridge-app-icon.png', sizes: '192x192', type: 'image/png' },
            { src: '/icons/schoolbridge-app-icon-512.png', sizes: '512x512', type: 'image/png' },
            { src: '/app-icon.svg', sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        }
        const link = document.createElement('link')
        link.rel = 'manifest'
        link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }))
        document.head.appendChild(link)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173b63" />
    <meta name="description" content="SchoolBridge school management platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SchoolBridge" />
    <title>SchoolBridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
