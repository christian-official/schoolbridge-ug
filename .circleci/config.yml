version: 2.1

jobs:
  backend-api-core:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Core API and access tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_api.py backend/tests/test_database_health.py -k "health_endpoint or school_records_require_authentication or admin_can_login_and_create_class or duplicate_class_and_stream or backup_download or admin_can_download_valid_sqlite_backup or restore_rejects_invalid_database_file or admin_can_stage_valid_restore"

  backend-api-academics:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Finance, staff and examination tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_api.py -k "teacher_cannot_access_admin or admin_cannot_use_teacher or fee_payments or fee_payment_amount or phase_one_staff_and_finance or class_scoped_exams or teacher_exam_access or grading_scale or verified_marks or staff_registration or verify_all_scores or combined_school"

  backend-api-parent:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Parent access and device registration tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_api.py -k "parent_portal or parent_liaison or sync_device_registration"

  backend-api-sync:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Change feed and offline snapshot tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_api.py -k "sync_change_feed or sync_device_checkpoint or sync_student_snapshot or sync_attendance_snapshot or sync_exam_and_mark_snapshots or sync_fee_snapshot"

  backend-api-offline:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Offline proposal, attendance and setup tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_api.py -k "sync_offline_proposals or teacher_offline_marks or offline_attendance_batch or offline_snapshot_pages or first_install or fresh_install or invalid_activation_license or demo_data or activation_attempts or legacy_install or environment_admin_bootstrap or partial_legacy_admin or owner_signed_identity"

  backend-migration-schema:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Migrated schema verification tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_migrations.py -k "fresh_database or sync_device_checkpoint_column or sync_change_proposals_migration or sync_change_journal_migrates"

  backend-migration-legacy:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Legacy database migration tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_migrations.py -k "baseline_adds or existing_database or current_database or legacy_school or partial_school_setup"

  backend-support-database:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install only database test dependencies
          command: python -m pip install --disable-pip-version-check pytest "sqlalchemy>=2.0,<3.0"
      - run:
          name: SQLite database tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production python -m pytest -vv -s backend/tests/test_database.py

  backend-support-owner-license:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install only licensing test dependencies
          command: python -m pip install --disable-pip-version-check pytest "cryptography>=42.0,<46.0"
      - run:
          name: Owner licensing CLI tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production python -m pytest -vv -s backend/tests/test_owner_license_tool.py

  backend-support-sqlite-backup:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Scheduler and SQLite backup tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_backup_scheduler.py backend/tests/test_sqlite_backup.py

  backend-support-postgres-backup:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: PostgreSQL backup and restore unit tests
          command: PYTHONPATH=backend SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production .venv/bin/python -m pytest -q backend/tests/test_postgres_backup.py backend/tests/test_restore_postgres.py

  postgres-recovery-integration:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install PostgreSQL client and Python dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            python3 -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r backend/requirements-dev.txt
      - run:
          name: Start PostgreSQL 16
          command: |
            docker run -d --name schoolbridge-ci-postgres \
              -e POSTGRES_USER=schoolbridge \
              -e POSTGRES_PASSWORD=ci-postgres-password \
              -e POSTGRES_DB=schoolbridge_restore_ci \
              -p 5432:5432 postgres:16
            for attempt in $(seq 1 60); do
              if pg_isready -h 127.0.0.1 -U schoolbridge -d schoolbridge_restore_ci; then exit 0; fi
              sleep 2
            done
            docker logs schoolbridge-ci-postgres
            exit 1
      - run:
          name: Run real PostgreSQL backup and restore drill
          command: |
            PYTHONPATH=backend \
            SCHOOLBRIDGE_DATABASE_URL=sqlite:///./schoolbridge_ci.db \
            SCHOOLBRIDGE_SECRET_KEY=ci-only-secret-key-not-for-production \
            SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL=postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci \
            .venv/bin/python -m pytest -q backend/tests/test_postgres_restore_integration.py

  frontend-build:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install Node.js 22
          command: |
            cd frontend
            source /opt/circleci/.nvm/nvm.sh
            nvm install 22
            nvm use 22
            node --version
            npm --version
      - run:
          name: Install frontend dependencies
          command: |
            cd frontend
            source /opt/circleci/.nvm/nvm.sh
            nvm use 22
            npm ci
      - run:
          name: Lint, test and build frontend
          command: |
            cd frontend
            source /opt/circleci/.nvm/nvm.sh
            nvm use 22
            npm run lint
            npm run test:offline
            npm run test:pwa
            npm run build
      - run:
          name: Run real-browser offline tests
          command: |
            cd frontend
            source /opt/circleci/.nvm/nvm.sh
            nvm use 22
            npm install --no-save --no-package-lock playwright@1.56.1
            npx playwright install --with-deps chromium
            npm run test:offline:browser

  local-deployment-package:
    machine:
      image: ubuntu-2404:current
    environment:
      POSTGRES_DB: schoolbridge
      POSTGRES_USER: schoolbridge
      POSTGRES_PASSWORD: ci-only-postgres-password
      SCHOOLBRIDGE_SECRET_KEY: ci-only-application-secret
      SCHOOLBRIDGE_LICENSE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SCHOOLBRIDGE_PORT: "18080"
    steps:
      - checkout
      - run:
          name: Validate local Compose deployment configuration
          command: docker compose config --quiet
      - run:
          name: Build and export all images as the USB workflow does
          command: |
            docker pull postgres:16-alpine &
            postgres_pull_pid=$!
            docker compose build --parallel backend frontend
            wait "$postgres_pull_pid"
            docker image inspect schoolbridge/backend:local schoolbridge/frontend:local postgres:16-alpine
            docker save -o /tmp/schoolbridge-images.tar postgres:16-alpine schoolbridge/backend:local schoolbridge/frontend:local
            docker image rm schoolbridge/backend:local schoolbridge/frontend:local
            docker load -i /tmp/schoolbridge-images.tar
      - run:
          name: Verify scripts and build a source-free USB Compose package
          command: |
            test -s scripts/prepare-usb.ps1
            test -s scripts/install-schoolbridge.ps1
            test -s scripts/prepare-school-host.ps1
            grep -q 'prepare-school-host.ps1' scripts/prepare-usb.ps1
            grep -q 'Docker Desktop Installer.exe' scripts/prepare-usb.ps1
            grep -q 'wsl.msi' scripts/prepare-usb.ps1
            grep -q 'SHA256SUMS.txt' scripts/prepare-usb.ps1
            grep -q 'USB_INSTALLATION.md' scripts/prepare-usb.ps1
            grep -q 'prepare-school-host.ps1' scripts/install-schoolbridge.ps1
            grep -q 'Get-FileHash' scripts/install-schoolbridge.ps1
            grep -q 'SHA256SUMS.txt' docs/USB_INSTALLATION.md
            test -s docs/USB_INSTALLATION.md
            grep -q 'proxy_pass http://backend:8001' frontend/nginx.conf
            grep -q 'SCHOOLBRIDGE_LICENSE_PUBLIC_KEY' scripts/install-schoolbridge.ps1
            python3 - <<'PY'
            from pathlib import Path
            import re
            source = Path("docker-compose.yml").read_text()
            package = re.sub(r"(?m)^    build:\r?\n      context: \./(backend|frontend)\r?\n", "", source)
            package = package.replace(
                "  schoolbridge-edge:\n    driver: bridge\n",
                "  schoolbridge-edge:\n    driver: bridge\n    internal: true\n",
            )
            assert "context: ./backend" not in package
            assert "context: ./frontend" not in package
            assert "image: schoolbridge/backend:local" in package
            assert "image: schoolbridge/frontend:local" in package
            assert "image: postgres:16-alpine" in package
            Path("/tmp/schoolbridge-usb").mkdir(exist_ok=True)
            Path("/tmp/schoolbridge-usb/docker-compose.yml").write_text(package)
            Path("/tmp/schoolbridge-usb/.env").write_text(
                "POSTGRES_DB=schoolbridge\nPOSTGRES_USER=schoolbridge\n"
                "POSTGRES_PASSWORD=ci-only-postgres-password\n"
                "SCHOOLBRIDGE_SECRET_KEY=ci-only-application-secret\n"
                "SCHOOLBRIDGE_LICENSE_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n"
                "SCHOOLBRIDGE_PORT=18080\nSCHOOLBRIDGE_BACKUP_INTERVAL_HOURS=24\n"
            )
            PY
            docker compose --env-file /tmp/schoolbridge-usb/.env -f /tmp/schoolbridge-usb/docker-compose.yml config --quiet
      - run:
          name: Boot packaged application without source folders
          command: |
            dc() { docker compose --env-file /tmp/schoolbridge-usb/.env -p schoolbridge-usb-ci -f /tmp/schoolbridge-usb/docker-compose.yml "$@"; }
            dc up -d --no-build
            success=0
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then success=1; break; fi
              sleep 2
            done
            if [ "$success" -ne 1 ]; then dc logs; exit 1; fi
            curl --fail --silent http://127.0.0.1:18080/ | grep -qi 'schoolbridge'
            dc exec -T database psql -U schoolbridge -d schoolbridge -c "CREATE TABLE usb_ci_persistence_check (id integer primary key, marker text); INSERT INTO usb_ci_persistence_check VALUES (1, 'survives-restart')"
            # Restart PostgreSQL first and wait until it accepts connections.
            # Restarting both services together races backend startup migrations
            # against PostgreSQL recovery and can produce a false persistence failure.
            dc restart database
            database_ready=0
            for attempt in $(seq 1 60); do
              if dc exec -T database pg_isready -U schoolbridge -d schoolbridge >/dev/null 2>&1; then
                database_ready=1
                break
              fi
              sleep 2
            done
            if [ "$database_ready" -ne 1 ]; then
              dc logs --tail=200
              echo "PostgreSQL did not become ready after restart."
              exit 1
            fi

            # Restart the backend only after PostgreSQL is ready, then require
            # a successful API health check before querying persisted data.
            dc restart backend
            backend_ready=0
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
                backend_ready=1
                break
              fi
              sleep 2
            done
            if [ "$backend_ready" -ne 1 ]; then
              dc logs --tail=200
              echo "Backend API did not become healthy after restart."
              exit 1
            fi

            if ! marker=$(dc exec -T database psql -U schoolbridge -d schoolbridge -tAc "SELECT marker FROM usb_ci_persistence_check WHERE id=1" | tr -d '[:space:]'); then
              dc logs --tail=200
              echo "Could not read the USB persistence marker after restart."
              exit 1
            fi
            if [ "$marker" != "survives-restart" ]; then
              dc logs --tail=200
              echo "USB persistence marker was not preserved: '$marker'."
              exit 1
            fi
            curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null
      - run:
          name: Assemble downloadable offline USB package
          command: |
            set -euo pipefail
            pkg="/tmp/SchoolBridge-USB"
            mkdir -p "$pkg/runtime" "$pkg/docs"
            cp /tmp/schoolbridge-images.tar "$pkg/schoolbridge-images.tar"
            cp /tmp/schoolbridge-usb/docker-compose.yml "$pkg/docker-compose.yml"
            cp scripts/install-schoolbridge.ps1 scripts/check-school-host.ps1 scripts/prepare-school-host.ps1 "$pkg/"
            cp docs/USB_INSTALLATION.md docs/WINDOWS_RUNTIME_PREPARATION.md docs/SCHOOL_READINESS_AND_INSTALLATION.md "$pkg/docs/"
            cat > "$pkg/.env.example" \<<'EOF'
            SCHOOLBRIDGE_LICENSE_PUBLIC_KEY=
            SCHOOLBRIDGE_PORT=8080
            SCHOOLBRIDGE_BACKUP_RETENTION_DAYS=30
            SCHOOLBRIDGE_BACKUP_INTERVAL_HOURS=24
            EOF
            (
              release_json="$(curl --fail --location --retry 3 https://api.github.com/repos/microsoft/WSL/releases/latest)"
              wsl_url="$(printf '%s' "$release_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x["browser_download_url"] for x in d.get("assets",[]) if x["name"].lower().endswith(".x64.msi")]; assert len(a)==1, "Expected exactly one x64 WSL MSI"; print(a[0])')"
              curl --fail --location --retry 3 "$wsl_url" -o "$pkg/runtime/wsl.msi"
            ) &
            wsl_download_pid=$!
            curl --fail --location --retry 3 "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -o "$pkg/runtime/Docker Desktop Installer.exe" &
            docker_download_pid=$!
            wait "$wsl_download_pid"
            wait "$docker_download_pid"
            (cd "$pkg" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
            cd /tmp
            zip -qr SchoolBridge-USB.zip SchoolBridge-USB
            unzip -t SchoolBridge-USB.zip
            python3 - \<<'PY'
            from pathlib import Path
            from zipfile import ZipFile
            import hashlib
            archive = Path("/tmp/SchoolBridge-USB.zip")
            with ZipFile(archive) as package:
                names = set(package.namelist())
                required = {
                    "SchoolBridge-USB/schoolbridge-images.tar",
                    "SchoolBridge-USB/docker-compose.yml",
                    "SchoolBridge-USB/install-schoolbridge.ps1",
                    "SchoolBridge-USB/check-school-host.ps1",
                    "SchoolBridge-USB/prepare-school-host.ps1",
                    "SchoolBridge-USB/runtime/Docker Desktop Installer.exe",
                    "SchoolBridge-USB/runtime/wsl.msi",
                    "SchoolBridge-USB/SHA256SUMS.txt",
                    "SchoolBridge-USB/docs/USB_INSTALLATION.md",
                }
                missing = required - names
                assert not missing, f"USB archive missing: {sorted(missing)}"
                root = "SchoolBridge-USB/"
                manifest = package.read("SchoolBridge-USB/SHA256SUMS.txt").decode("ascii").splitlines()
                assert manifest, "SHA256 manifest is empty"
                for entry in manifest:
                    digest, relative = entry.split("  ", 1)
                    payload = package.read(root + relative.removeprefix("./"))
                    actual = hashlib.sha256(payload).hexdigest()
                    assert actual.lower() == digest.lower(), f"SHA256 mismatch: {relative}"
            assert archive.stat().st_size > 100_000_000, "USB image archive is unexpectedly small"
            print(f"USB ZIP verified: {archive.stat().st_size:,} bytes; {len(manifest)} manifest entries")
            PY
      - store_artifacts:
          path: /tmp/SchoolBridge-USB.zip
          destination: SchoolBridge-USB.zip

  windows-installer-script-validation:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Parse all Windows PowerShell installer scripts
          command: |
            $ErrorActionPreference = "Stop"
            $files = @(
              "scripts/prepare-usb.ps1",
              "scripts/install-schoolbridge.ps1",
              "scripts/check-school-host.ps1",
              "scripts/prepare-school-host.ps1"
            )
            foreach ($file in $files) {
              Write-Host "Parsing $file"
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                throw "PowerShell syntax validation failed for $file"
              }
              Write-Host "PowerShell syntax OK: $file"
            }
      - run:
          name: Download official Windows runtime installers
          command: |
            $ErrorActionPreference = "Stop"
            $runtime = Join-Path $env:TEMP "schoolbridge-runtime-validation"
            New-Item -ItemType Directory -Force -Path $runtime | Out-Null
            $dockerPath = Join-Path $runtime "Docker Desktop Installer.exe"
            $wslPath = Join-Path $runtime "wsl.msi"
            Write-Host "Downloading Docker Desktop installer (maximum 240 seconds)"
            & curl.exe --fail --location --retry 2 --connect-timeout 30 --max-time 240 --output $dockerPath "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
            if ($LASTEXITCODE -ne 0) { throw "Docker Desktop installer download failed (curl exit $LASTEXITCODE)." }
            Write-Host "Docker Desktop installer download complete"
            Write-Host "Resolving the official stable WSL x64 MSI"
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/WSL/releases/latest" -TimeoutSec 45
            $wslAssets = @($release.assets | Where-Object { $_.name.ToLowerInvariant().EndsWith(".x64.msi") })
            if ($wslAssets.Count -ne 1) { throw "Could not identify exactly one official stable x64 WSL MSI." }
            Write-Host "Downloading WSL MSI (maximum 240 seconds)"
            & curl.exe --fail --location --retry 2 --connect-timeout 30 --max-time 240 --output $wslPath $wslAssets[0].browser_download_url
            if ($LASTEXITCODE -ne 0) { throw "WSL MSI download failed (curl exit $LASTEXITCODE)." }
            Write-Host "WSL MSI download complete"
      - run:
          name: Verify Windows runtime installer signatures
          command: |
            $ErrorActionPreference = "Stop"
            $runtime = Join-Path $env:TEMP "schoolbridge-runtime-validation"
            foreach ($runtimeFile in @(
              @{ Path = (Join-Path $runtime "Docker Desktop Installer.exe"); Publisher = "Docker" },
              @{ Path = (Join-Path $runtime "wsl.msi"); Publisher = "Microsoft Corporation" }
            )) {
              if (-not (Test-Path -LiteralPath $runtimeFile.Path)) { throw "Missing downloaded runtime installer: $($runtimeFile.Path)" }
              $signature = Get-AuthenticodeSignature -FilePath $runtimeFile.Path
              if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($runtimeFile.Path) ($($signature.Status))" }
              if ($signature.SignerCertificate.Subject -notmatch $runtimeFile.Publisher) { throw "Unexpected signer for $($runtimeFile.Path): $($signature.SignerCertificate.Subject)" }
              Write-Host "Authenticode signature verified: $($runtimeFile.Path) — $($signature.SignerCertificate.Subject)"
            }

workflows:
  schoolbridge-ci:
    jobs:
      - backend-api-core
      - backend-api-academics
      - backend-api-parent
      - backend-api-sync
      - backend-api-offline
      - backend-migration-schema
      - backend-migration-legacy
      - backend-support-database
      - backend-support-owner-license
      - backend-support-sqlite-backup
      - backend-support-postgres-backup
      - postgres-recovery-integration
      - frontend-build
      - local-deployment-package
      - windows-installer-script-validation
