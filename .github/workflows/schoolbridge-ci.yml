name: SchoolBridge CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolbridge-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: backend
  SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
  SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production

jobs:
  backend-tests:
    name: Backend and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Run backend, database, migration and backup tests
        run: python -m pytest -q backend/tests

  postgres-recovery:
    name: PostgreSQL backup and recovery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolbridge
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: schoolbridge_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolbridge -d schoolbridge_restore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Run real PostgreSQL backup and restore drill
        env:
          SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL: postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci
        run: python -m pytest -q backend/tests/test_postgres_restore_integration.py

  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Offline and PWA tests
        run: |
          npm run test:offline
          npm run test:pwa
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real-browser offline tests
        run: npm run test:offline:browser

  windows-script-validation:
    name: Windows installer PowerShell validation
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse installer scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/prepare-usb.ps1",
            "scripts/install-schoolbridge.ps1",
            "scripts/check-school-host.ps1",
            "scripts/prepare-school-host.ps1"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing installer script: $file" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
