name: SchoolBridge CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate each run so separate pushes/manual runs can execute concurrently.
  group: schoolbridge-ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  desktop-shell-build:
    name: desktop / standalone Windows application shell
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile standalone Tauri desktop shell
        working-directory: frontend
        run: npm run desktop:build
      - name: Test desktop backend lifecycle health validation
        working-directory: frontend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build and verify standalone Windows executable
        working-directory: frontend
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --features desktop,custom-protocol
          $executable = Join-Path $PWD "src-tauri/target/release/schoolbridge.exe"
          if (-not (Test-Path $executable -PathType Leaf)) {
            Write-Host "Release directory contents:"
            Get-ChildItem "src-tauri/target/release" -ErrorAction SilentlyContinue | Select-Object Name, Length
            throw "The standalone SchoolBridge desktop executable was not produced at $executable"
          }
          Write-Host "Verified standalone executable: $executable"
      - name: Publish standalone desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBridge-Desktop-Shell-Windows
          path: frontend/src-tauri/target/release/schoolbridge.exe
          if-no-files-found: error
          retention-days: 30

  backend-tests:
    name: backend / complete test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run complete backend test suite
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  backend-windows-native:
    name: backend / native Windows SQLite suite
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run backend and SQLite tests on native Windows
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_windows_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  native-windows-package:
    name: windows / native offline package install-and-boot
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage official CPython embeddable runtime
        shell: pwsh
        run: |
          $version = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $getPip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip" -OutFile $zip
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          "PYTHON_EMBED_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GET_PIP_SCRIPT=$getPip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build complete offline native package
        shell: pwsh
        run: |
          ./scripts/prepare-native-windows.ps1 -PythonEmbedZip "$env:PYTHON_EMBED_ZIP" -GetPipScript "$env:GET_PIP_SCRIPT"
      - name: Install native package without network dependencies
        shell: pwsh
        run: |
          ./dist/SchoolBridge-Native-Windows/install-native-windows.ps1 -LicensePublicKey "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      - name: Boot native application and verify frontend plus SQLite health
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData "SchoolBridge"
          $stdout = Join-Path $env:RUNNER_TEMP "schoolbridge-native.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "schoolbridge-native.stderr.log"
          $launcher = Start-Process powershell.exe -ArgumentList @("-NoProfile","-ExecutionPolicy","Bypass","-File",(Join-Path $root "run-native-windows.ps1")) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/health" -TimeoutSec 3
                if ($health.status -eq "ok" -and $health.database.type -eq "sqlite") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Native SchoolBridge did not become healthy with local SQLite."
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw "Native frontend index.html was not served." }
            $assetPath = [regex]::Match($page.Content, 'src="(/assets/[^"]+\.js)"').Groups[1].Value
            if ([string]::IsNullOrWhiteSpace($assetPath)) { throw "Native frontend JavaScript bundle reference is missing." }
            $asset = Invoke-WebRequest -Uri ("http://127.0.0.1:8080" + $assetPath) -UseBasicParsing
            if ($asset.StatusCode -ne 200 -or $asset.Content.Length -lt 1000) { throw "Native frontend JavaScript bundle did not load." }
            if (-not (Test-Path (Join-Path $root "backend/app/static/index.html"))) { throw "Frontend static files were not installed in the backend bundle." }
            if (-not (Test-Path (Join-Path $root "data/schoolbridge.db"))) { throw "Native SQLite database file was not created." }
            Write-Host "Native package booted: frontend served and SQLite health is OK."
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "uvicorn app.main:app" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Publish tested native Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBridge-Native-Windows
          path: dist/SchoolBridge-Native-Windows/
          if-no-files-found: error
          retention-days: 30

  postgres-recovery-integration:
    name: backend / postgres-recovery-integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolbridge
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: schoolbridge_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolbridge -d schoolbridge_restore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Prepare PostgreSQL client tools from the service image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-tools"
          for tool in pg_dump pg_restore createdb dropdb psql; do
            cat > "$RUNNER_TEMP/pg-tools/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "$(id -u):$(id -g)" --network host -v /tmp:/tmp -e PGPASSWORD="\${PGPASSWORD:-}" postgres:16 $tool "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/pg-tools/$tool"
          done
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run real PostgreSQL backup and restore drill
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
          SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL: postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci
        run: python -m pytest -q backend/tests/test_postgres_restore_integration.py

  frontend-build:
    name: frontend / lint-tests-build-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run test:offline
          npm run test:pwa
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run real-browser offline tests
        working-directory: frontend
        run: npm run test:offline:browser

  local-deployment-package:
    name: deployment / compose-build-and-usb-validation
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: schoolbridge
      POSTGRES_USER: schoolbridge
      POSTGRES_PASSWORD: ci-only-postgres-password
      SCHOOLBRIDGE_SECRET_KEY: ci-only-application-secret
      SCHOOLBRIDGE_LICENSE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SCHOOLBRIDGE_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Build and export app images
        run: |
          docker pull postgres:16-alpine &
          postgres_pull_pid=$!
          docker compose build --parallel backend frontend
          wait "$postgres_pull_pid"
          docker image inspect schoolbridge/backend:local schoolbridge/frontend:local postgres:16-alpine
          docker save -o /tmp/schoolbridge-images.tar postgres:16-alpine schoolbridge/backend:local schoolbridge/frontend:local
          docker image rm schoolbridge/backend:local schoolbridge/frontend:local
          docker load -i /tmp/schoolbridge-images.tar
      - name: Validate USB packaging inputs and source-free Compose
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/prepare-usb.ps1
          test -s scripts/install-schoolbridge.ps1
          test -s scripts/prepare-school-host.ps1
          grep -q 'prepare-school-host.ps1' scripts/prepare-usb.ps1
          grep -q 'Docker Desktop Installer.exe' scripts/prepare-usb.ps1
          grep -q 'wsl.msi' scripts/prepare-usb.ps1
          grep -q 'SHA256SUMS.txt' scripts/prepare-usb.ps1
          grep -q 'USB_INSTALLATION.md' scripts/prepare-usb.ps1
          grep -q 'prepare-school-host.ps1' scripts/install-schoolbridge.ps1
          grep -q 'Get-FileHash' scripts/install-schoolbridge.ps1
          grep -q 'SHA256SUMS.txt' docs/USB_INSTALLATION.md
          grep -q 'proxy_pass http://backend:8001' frontend/nginx.conf
          grep -q 'SCHOOLBRIDGE_LICENSE_PUBLIC_KEY' scripts/install-schoolbridge.ps1
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("docker-compose.yml").read_text()
          package = re.sub(r"(?m)^    build:\r?\n      context: \.\/(backend|frontend)\r?\n", "", source)
          assert "schoolbridge-internal:" in package
          assert "    internal: true" in package
          assert "schoolbridge-edge:" in package
          assert "context: ./backend" not in package
          assert "context: ./frontend" not in package
          assert "image: schoolbridge/backend:local" in package
          assert "image: schoolbridge/frontend:local" in package
          assert "image: postgres:16-alpine" in package
          Path("/tmp/schoolbridge-usb").mkdir(exist_ok=True)
          Path("/tmp/schoolbridge-usb/docker-compose.yml").write_text(package)
          Path("/tmp/schoolbridge-usb/.env").write_text(
              "POSTGRES_DB=schoolbridge\nPOSTGRES_USER=schoolbridge\n"
              "POSTGRES_PASSWORD=ci-only-postgres-password\n"
              "SCHOOLBRIDGE_SECRET_KEY=ci-only-application-secret\n"
              "SCHOOLBRIDGE_LICENSE_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n"
              "SCHOOLBRIDGE_PORT=18080\nSCHOOLBRIDGE_BACKUP_INTERVAL_HOURS=24\n"
          )
          PY
          docker compose --env-file /tmp/schoolbridge-usb/.env -f /tmp/schoolbridge-usb/docker-compose.yml config --quiet
      - name: Boot packaged app and verify database persistence
        shell: bash
        run: |
          set -euo pipefail
          dc() { docker compose --env-file /tmp/schoolbridge-usb/.env -p schoolbridge-usb-ci -f /tmp/schoolbridge-usb/docker-compose.yml "$@"; }
          dc up -d --no-build
          success=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then success=1; break; fi
            sleep 2
          done
          if [ "$success" -ne 1 ]; then
            echo "=== Compose status ==="
            dc ps
            echo "=== Published frontend ports ==="
            dc port frontend 80 || true
            echo "=== Host-side HTTP diagnostics ==="
            curl --verbose --max-time 10 http://127.0.0.1:18080/api/health || true
            echo "=== Frontend loopback diagnostics ==="
            dc exec -T frontend wget -S -O- http://127.0.0.1/api/health || true
            echo "=== Frontend-to-backend diagnostics ==="
            dc exec -T frontend wget -S -O- http://backend:8001/api/health || true
            echo "=== Container logs ==="
            dc logs
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/ | grep -qi 'schoolbridge'
          dc exec -T database psql -U schoolbridge -d schoolbridge -c "CREATE TABLE usb_ci_persistence_check (id integer primary key, marker text); INSERT INTO usb_ci_persistence_check VALUES (1, 'survives-restart')"
          dc restart backend database
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 2
          done
          marker=$(dc exec -T database psql -U schoolbridge -d schoolbridge -tAc "SELECT marker FROM usb_ci_persistence_check WHERE id=1" | tr -d '[:space:]')
          test "$marker" = "survives-restart"
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null
      - name: Assemble offline USB archive and verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          pkg="/tmp/SchoolBridge-USB"
          mkdir -p "$pkg/runtime" "$pkg/docs"
          cp /tmp/schoolbridge-images.tar "$pkg/schoolbridge-images.tar"
          cp /tmp/schoolbridge-usb/docker-compose.yml "$pkg/docker-compose.yml"
          cp scripts/install-schoolbridge.ps1 scripts/check-school-host.ps1 scripts/prepare-school-host.ps1 "$pkg/"
          cp docs/USB_INSTALLATION.md docs/WINDOWS_RUNTIME_PREPARATION.md docs/SCHOOL_READINESS_AND_INSTALLATION.md "$pkg/docs/"
          cat > "$pkg/.env.example" <<'EOF'
          SCHOOLBRIDGE_LICENSE_PUBLIC_KEY=
          SCHOOLBRIDGE_PORT=8080
          SCHOOLBRIDGE_BACKUP_RETENTION_DAYS=30
          SCHOOLBRIDGE_BACKUP_INTERVAL_HOURS=24
          EOF
          release_json="$(curl --fail --location --retry 3 https://api.github.com/repos/microsoft/WSL/releases/latest)"
          wsl_url="$(printf '%s' "$release_json" | python -c 'import json,sys; d=json.load(sys.stdin); a=[x["browser_download_url"] for x in d.get("assets",[]) if x["name"].lower().endswith(".x64.msi")]; assert len(a)==1; print(a[0])')"
          curl --fail --location --retry 3 "$wsl_url" -o "$pkg/runtime/wsl.msi"
          curl --fail --location --retry 3 "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -o "$pkg/runtime/Docker Desktop Installer.exe"
          (cd "$pkg" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cd /tmp
          zip -qr SchoolBridge-USB.zip SchoolBridge-USB
          unzip -t SchoolBridge-USB.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          archive = Path("/tmp/SchoolBridge-USB.zip")
          with ZipFile(archive) as package:
              names = set(package.namelist())
              required = {
                  "SchoolBridge-USB/schoolbridge-images.tar",
                  "SchoolBridge-USB/docker-compose.yml",
                  "SchoolBridge-USB/install-schoolbridge.ps1",
                  "SchoolBridge-USB/check-school-host.ps1",
                  "SchoolBridge-USB/prepare-school-host.ps1",
                  "SchoolBridge-USB/runtime/Docker Desktop Installer.exe",
                  "SchoolBridge-USB/runtime/wsl.msi",
                  "SchoolBridge-USB/SHA256SUMS.txt",
                  "SchoolBridge-USB/docs/USB_INSTALLATION.md",
              }
              assert not (required - names), f"Missing: {sorted(required - names)}"
              manifest = package.read("SchoolBridge-USB/SHA256SUMS.txt").decode("ascii").splitlines()
              assert manifest
              for entry in manifest:
                  digest, relative = entry.split("  ", 1)
                  payload = package.read("SchoolBridge-USB/" + relative.removeprefix("./"))
                  assert hashlib.sha256(payload).hexdigest().lower() == digest.lower(), relative
          assert archive.stat().st_size > 100_000_000
          print(f"USB ZIP verified: {archive.stat().st_size:,} bytes; {len(manifest)} manifest entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolBridge-USB-package
          path: /tmp/SchoolBridge-USB.zip
          if-no-files-found: error

  windows-installer-script-validation:
    name: windows / installer-script-validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts and verify official runtime signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "scripts/prepare-usb.ps1",
            "scripts/install-schoolbridge.ps1",
            "scripts/check-school-host.ps1",
            "scripts/prepare-school-host.ps1",
            "scripts/prepare-native-windows.ps1",
            "scripts/install-native-windows.ps1",
            "scripts/run-native-windows.ps1",
            "scripts/configure-lan-firewall.ps1",
            "scripts/provision-lan-certificates.ps1"
          )
          $runtime = Join-Path $env:TEMP "schoolbridge-runtime-validation"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $dockerPath = Join-Path $runtime "Docker Desktop Installer.exe"
          $wslPath = Join-Path $runtime "wsl.msi"
          Invoke-WebRequest -Uri "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -OutFile $dockerPath
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/WSL/releases/latest"
          $wslAssets = @($release.assets | Where-Object { $_.name.ToLowerInvariant().EndsWith(".x64.msi") })
          if ($wslAssets.Count -ne 1) { throw "Could not identify exactly one official stable x64 WSL MSI." }
          Invoke-WebRequest -Uri $wslAssets[0].browser_download_url -OutFile $wslPath
          foreach ($runtimeFile in @(
            @{ Path = $dockerPath; Publisher = "Docker" },
            @{ Path = $wslPath; Publisher = "Microsoft Corporation" }
          )) {
            $signature = Get-AuthenticodeSignature -FilePath $runtimeFile.Path
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($runtimeFile.Path) ($($signature.Status))" }
            if ($signature.SignerCertificate.Subject -notmatch $runtimeFile.Publisher) { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }
          }
          foreach ($required in @(
            "scripts/NATIVE_WINDOWS_INSTALLATION.md",
            "backend/requirements.txt",
            "frontend/package-lock.json"
          )) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Missing native Windows packaging input: $required" }
          }
          $builder = Get-Content "scripts/prepare-native-windows.ps1" -Raw
          $installer = Get-Content "scripts/install-native-windows.ps1" -Raw
          $launcher = Get-Content "scripts/run-native-windows.ps1" -Raw
          $lanFirewall = Get-Content "scripts/configure-lan-firewall.ps1" -Raw
          $lanProvisioner = Get-Content "scripts/provision-lan-certificates.ps1" -Raw
          $lanProvisionerPy = Get-Content "scripts/provision-lan-certificates.py" -Raw
          if ($builder -notmatch "--platform win_amd64" -or $builder -notmatch "--only-binary") { throw "Native package must resolve binary Windows wheels." }
          if ($installer -notmatch "--no-index" -or $installer -notmatch "SHA256SUMS.txt") { throw "Native installer must verify and install offline." }
          if ($launcher -notmatch "--host 127\.0\.0\.1") { throw "Initial native host must remain loopback-only." }
          if ($builder -notmatch "configure-lan-firewall" -or $builder -notmatch "provision-lan-certificates" -or $builder -notmatch "DESKTOP_LAN_ACCESS") { throw "Native USB package must include LAN certificate provisioning, firewall setup, and security documentation." }
          if ($lanProvisioner -notmatch "icacls" -or $lanProvisioner -notmatch "SCHOOLBRIDGE_LAN_ENABLED" -or $lanProvisionerPy -notmatch "SubjectAlternativeName" -or $lanProvisionerPy -notmatch "SERVER_AUTH") { throw "LAN certificate provisioning must restrict private-key ACLs, preserve opt-in, and issue an IP-bound server-auth certificate." }
          foreach ($requiredLanGuard in @("Profile = `"Private`"", "RemoteAddress = `"LocalSubnet`"", "LocalAddress = `$BindAddress", "Program = `$python", "EdgeTraversalPolicy = `"Block`"")) {
            if ($lanFirewall -notlike "*$requiredLanGuard*") { throw "LAN firewall rule is missing required scope: $requiredLanGuard" }
          }
          if ($lanFirewall -match "RemoteAddress = `"Any`"" -or $lanFirewall -match "Profile = `"Any`"") { throw "LAN firewall rule must not allow all remote addresses or profiles." }
          foreach ($file in $files) {
            Write-Host "Checking PowerShell syntax: $file"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                Write-Host ("{0}:{1}:{2}: {3} [{4}]" -f $file, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message, $parseError.Extent.Text)
              }
              throw "PowerShell syntax validation failed for $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
