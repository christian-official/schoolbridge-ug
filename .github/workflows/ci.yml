name: SchoolBridge PWA CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Give every commit its own group so later pushes never cancel its CI run.
  group: schoolbridge-ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: backend / complete test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run complete backend test suite
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  backend-windows-native:
    name: backend / native Windows SQLite suite
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run backend and SQLite tests on native Windows
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_windows_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  windows-desktop-installer:
    name: windows / offline Tauri installer build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Stage official CPython embeddable runtime
        shell: pwsh
        run: |
          $version = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $getPip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip" -OutFile $zip
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          "PYTHON_EMBED_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GET_PIP_SCRIPT=$getPip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Prepare offline Windows backend resources
        shell: pwsh
        run: |
          ./scripts/prepare-native-windows.ps1 -PythonEmbedZip "$env:PYTHON_EMBED_ZIP" -GetPipScript "$env:GET_PIP_SCRIPT"
      - name: Create ephemeral CI-only owner verification public key
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $key = [Convert]::ToBase64String($bytes)
          Set-Content -LiteralPath "frontend/src-tauri/owner-activation-public-key.txt" -Value $key -Encoding ASCII -NoNewline
      - name: Stage Tauri desktop resources
        shell: pwsh
        run: ./scripts/prepare-tauri-resources.ps1
      - name: Build offline Windows desktop installer
        working-directory: frontend
        shell: pwsh
        run: npm run desktop:build
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $bundle = "frontend/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS Windows installer." }
          if ($installer.Length -lt 100MB) { throw "Offline installer is unexpectedly small; the bundled WebView2 runtime may be missing." }
          Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256 | Format-List
          Write-Host "CI-only installer verified: $($installer.FullName) ($($installer.Length) bytes)"
      - name: Install and boot the packaged desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "frontend/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw "Verified Tauri installer is missing." }

          $installDir = "C:\SchoolBridge-CI-Install"
          if (Test-Path $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent offline desktop installation failed with exit code $($install.ExitCode)." }

          $app = Join-Path $installDir "schoolbridge.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            $found = Get-ChildItem -LiteralPath $installDir -Filter "schoolbridge.exe" -File -Recurse | Select-Object -First 1
            if (-not $found) { throw "Installed SchoolBridge desktop executable was not found." }
            $app = $found.FullName
          }

          $dataDir = Join-Path $env:LOCALAPPDATA "SchoolBridge\data"
          $database = Join-Path $dataDir "schoolbridge.sqlite3"
          $config = Join-Path $env:LOCALAPPDATA "SchoolBridge\config\.env"
          $stdout = Join-Path $env:RUNNER_TEMP "schoolbridge-desktop.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "schoolbridge-desktop.stderr.log"

          function Start-SchoolBridge {
            $script:desktop = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              if ($script:desktop.HasExited) {
                if (Test-Path $stdout) { Get-Content $stdout }
                if (Test-Path $stderr) { Get-Content $stderr }
                throw "SchoolBridge desktop exited before its local backend became ready."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/health" -TimeoutSec 3
                if ($health.status -eq "ok" -and $health.application -eq "SchoolBridge" -and $health.database.status -eq "connected" -and $health.database.type -eq "sqlite") { return }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (Test-Path (Join-Path $env:LOCALAPPDATA "SchoolBridge\logs\backend.log")) {
              Get-Content (Join-Path $env:LOCALAPPDATA "SchoolBridge\logs\backend.log") -Tail 100
            }
            throw "SchoolBridge did not become healthy with its local SQLite database."
          }

          try {
            Start-SchoolBridge
            if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "First launch did not create persistent local configuration." }
            if (-not (Test-Path -LiteralPath $database -PathType Leaf)) { throw "First launch did not create the local SQLite database." }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') { throw "Installed desktop frontend was not served locally." }

            Stop-Process -Id $script:desktop.Id -Force
            $script:desktop.WaitForExit()
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              try { Invoke-RestMethod -Uri "http://127.0.0.1:8080/api/health" -TimeoutSec 2 | Out-Null; Start-Sleep -Seconds 1 }
              catch { break }
            }

            $env:SCHOOLBRIDGE_CI_DB = $database
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['SCHOOLBRIDGE_CI_DB']); c.execute('CREATE TABLE IF NOT EXISTS desktop_install_ci_check (id INTEGER PRIMARY KEY, marker TEXT NOT NULL)'); c.execute('INSERT OR REPLACE INTO desktop_install_ci_check (id, marker) VALUES (1, ?)', ('persists-after-restart',)); c.commit(); c.close()"
            if ($LASTEXITCODE -ne 0) { throw "Could not write the local database persistence marker." }

            Start-SchoolBridge
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['SCHOOLBRIDGE_CI_DB']); r=c.execute('SELECT marker FROM desktop_install_ci_check WHERE id=1').fetchone(); c.close(); assert r and r[0]=='persists-after-restart', 'Local database marker did not survive desktop restart'"
            if ($LASTEXITCODE -ne 0) { throw "Local SQLite data did not survive desktop restart." }
            Write-Host "Installed desktop booted locally; SQLite database and data survived restart."
          } finally {
            if ($script:desktop -and -not $script:desktop.HasExited) { Stop-Process -Id $script:desktop.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload CI-only installer build
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBridge-Tauri-Windows-CI-Test-Only
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  postgres-recovery-integration:
    name: backend / postgres-recovery-integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolbridge
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: schoolbridge_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolbridge -d schoolbridge_restore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Prepare PostgreSQL client tools from the service image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-tools"
          for tool in pg_dump pg_restore createdb dropdb psql; do
            cat > "$RUNNER_TEMP/pg-tools/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "$(id -u):$(id -g)" --network host -v /tmp:/tmp -e PGPASSWORD="\${PGPASSWORD:-}" postgres:16 $tool "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/pg-tools/$tool"
          done
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run real PostgreSQL backup and restore drill
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
          SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL: postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci
        run: python -m pytest -q backend/tests/test_postgres_restore_integration.py

  frontend-build:
    name: frontend / lint-tests-build-browser
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: https://schoolbridge-api.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run test:offline
          npm run test:pwa
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run real-browser offline tests
        working-directory: frontend
        run: npm run test:offline:browser

