name: SchoolBridge CI

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
      SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend API tests
        run: PYTHONPATH=backend pytest -q backend/tests

  postgres-recovery-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolbridge
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: schoolbridge_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolbridge -d schoolbridge_restore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
      SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
      SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL: postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client and backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r backend/requirements-dev.txt
      - name: Run real PostgreSQL backup and restore drill
        run: PYTHONPATH=backend pytest -q backend/tests/test_postgres_restore_integration.py

  frontend-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:offline
      - run: npm run test:pwa
      - run: npm run build
      - name: Install pinned Playwright browser-test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser offline tests
        run: npm run test:offline:browser
