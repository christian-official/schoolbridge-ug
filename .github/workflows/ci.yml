name: SchoolBridge PWA CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Give every commit its own group so later pushes never cancel its CI run.
  group: schoolbridge-ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: backend / complete test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run complete backend test suite
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  backend-windows-native:
    name: backend / native Windows SQLite suite
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run backend and SQLite tests on native Windows
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_windows_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
        run: python -m pytest -q backend/tests

  postgres-recovery-integration:
    name: backend / postgres-recovery-integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolbridge
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: schoolbridge_restore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolbridge -d schoolbridge_restore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Prepare PostgreSQL client tools from the service image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg-tools"
          for tool in pg_dump pg_restore createdb dropdb psql; do
            cat > "$RUNNER_TEMP/pg-tools/$tool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "$(id -u):$(id -g)" --network host -v /tmp:/tmp -e PGPASSWORD="\${PGPASSWORD:-}" postgres:16 $tool "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/pg-tools/$tool"
          done
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run real PostgreSQL backup and restore drill
        env:
          PYTHONPATH: backend
          SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
          SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
          SCHOOLBRIDGE_POSTGRES_INTEGRATION_URL: postgresql+psycopg://schoolbridge:ci-postgres-password@127.0.0.1:5432/schoolbridge_restore_ci
        run: python -m pytest -q backend/tests/test_postgres_restore_integration.py

  frontend-build:
    name: frontend / lint-tests-build-browser
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: https://schoolbridge-api.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run test:offline
          npm run test:pwa
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run real-browser offline tests
        working-directory: frontend
        run: npm run test:offline:browser

