name: SchoolBridge CI

# CI is now executed by CircleCI. Keep this workflow manually runnable
# for emergency diagnostics without triggering duplicate GitHub-hosted jobs.
on:
  workflow_dispatch:

jobs:
  migration-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Direct CI contributors to CircleCI
        run: echo "SchoolBridge CI is maintained in .circleci/config.yml"
