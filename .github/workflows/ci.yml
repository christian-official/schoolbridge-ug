name: SchoolBridge CI

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOOLBRIDGE_DATABASE_URL: sqlite:///./schoolbridge_ci.db
      SCHOOLBRIDGE_SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend API tests
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:offline
      - run: npm run build
      - name: Install pinned Playwright browser-test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser offline tests
        run: npm run test:offline:browser
