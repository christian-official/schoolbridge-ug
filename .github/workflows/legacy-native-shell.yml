name: Legacy Windows native shell proof

on:
  push:
    branches:
      - feature/student-staff-finance
    paths:
      - "desktop-legacy-native/**"
      - ".github/workflows/legacy-native-shell.yml"
  pull_request:
    paths:
      - "desktop-legacy-native/**"
      - ".github/workflows/legacy-native-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-shell:
    name: Build wxWidgets native shell (compile proof only)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg and install wxWidgets
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not clone vcpkg." }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Could not bootstrap vcpkg." }
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkgRoot"
          & "$vcpkgRoot\vcpkg.exe" install wxwidgets:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "wxWidgets installation failed." }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S desktop-legacy-native -B build/legacy-native -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed." }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/legacy-native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native shell compilation failed." }

      - name: Upload compile-only prototype
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBridge-Legacy-Native-Shell-COMPILE-ONLY
          path: build/legacy-native/Release/SchoolBridgeLegacyShell.exe
          if-no-files-found: error
          retention-days: 7
